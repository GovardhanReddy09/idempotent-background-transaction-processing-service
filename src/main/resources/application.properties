spring.application.name=idempotent-transaction-service
spring.datasource.url=jdbc:h2:file:./data/transactions;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.port=8080
app.worker.fixed-delay-ms=2000
app.worker.max-attempts=3
app.worker.batch-size=100
app.worker.retry.initial-delay-ms=2000
app.worker.retry.max-delay-ms=60000
app.security.username=${APP_API_USERNAME:}
app.security.password=${APP_API_PASSWORD:}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
